name: keep-alive

# Supabase free засыпает после 7 дней без запросов; GitHub гасит расписания
# после 60 дней тишины в репо. Поэтому: еженедельный ping REST API
# + пустой коммит, который сам держит репо живым.

on:
  schedule:
    - cron: '0 6 * * 1' # понедельник, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" || true)
          echo "Supabase REST answered: $code (любой код — активность)"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Empty commit (repo stays active)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: weekly keep-alive"
          git push
